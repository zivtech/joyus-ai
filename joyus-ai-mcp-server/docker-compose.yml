# Joyus AI MCP Server - Docker Compose for Local Development

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-joyus_ai_mcp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP Server (development with hot reload)
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-joyus_ai_mcp}
      - BASE_URL=http://localhost:3000
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY must be set}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_HOSTED_DOMAIN=${GOOGLE_HOSTED_DOMAIN:-example.com}
      - ATLASSIAN_CLIENT_ID=${ATLASSIAN_CLIENT_ID}
      - ATLASSIAN_CLIENT_SECRET=${ATLASSIAN_CLIENT_SECRET}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JOYUS_ANTHROPIC_MODEL=${JOYUS_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - PLAYWRIGHT_MCP_BASE_URL=http://playwright:3002
      - PLAYWRIGHT_AUTH_TOKEN=${PLAYWRIGHT_AUTH_TOKEN:?PLAYWRIGHT_AUTH_TOKEN must be set}
      - INNGEST_DEV=1
      - INNGEST_BASE_URL=http://inngest:8288
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY:?INNGEST_EVENT_KEY must be set}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY:?INNGEST_SIGNING_KEY must be set}
    volumes:
      - ./src:/app/src
      - ./drizzle:/app/drizzle
    depends_on:
      db:
        condition: service_healthy
      playwright:
        condition: service_healthy
    command: >
      sh -c "npm run db:push && npm run dev"

  # Playwright MCP dependency
  playwright:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.playwright
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - PLAYWRIGHT_AUTH_TOKEN=${PLAYWRIGHT_AUTH_TOKEN:?PLAYWRIGHT_AUTH_TOKEN must be set}
    healthcheck:
      test: ["CMD", "node", "-e", "const c=new AbortController(); const t=setTimeout(() => c.abort(), 2000); fetch('http://127.0.0.1:3002/sse', { signal: c.signal }).then((r) => { clearTimeout(t); process.exit(r.ok ? 0 : 1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inngest Dev Server (LOCAL DEVELOPMENT ONLY)
  # Production should use Inngest Cloud or a separately deployed self-hosted
  # Inngest server, not `inngest dev`.
  inngest:
    image: inngest/inngest:v1.17.5
    command: inngest dev -u http://server:3000/api/inngest
    ports:
      - "127.0.0.1:8288:8288"
      - "127.0.0.1:8289:8289"
    depends_on:
      - server

volumes:
  postgres_data:
