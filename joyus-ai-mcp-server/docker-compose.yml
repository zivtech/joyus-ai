# Joyus AI MCP Server - Docker Compose for Local Development

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: joyus_ai_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP Server (development with hot reload)
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/joyus_ai_mcp
      - BASE_URL=http://localhost:3000
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-dev-key-change-me-in-prod}
      - ENABLE_DEV_AUTH_BYPASS=${ENABLE_DEV_AUTH_BYPASS:-false}
      - DEV_AUTH_EMAIL=${DEV_AUTH_EMAIL:-local-dev@example.test}
      - DEV_AUTH_NAME=${DEV_AUTH_NAME:-Local Developer}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_HOSTED_DOMAIN=${GOOGLE_HOSTED_DOMAIN:-example.com}
      - ATLASSIAN_CLIENT_ID=${ATLASSIAN_CLIENT_ID}
      - ATLASSIAN_CLIENT_SECRET=${ATLASSIAN_CLIENT_SECRET}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JOYUS_ANTHROPIC_MODEL=${JOYUS_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - PLAYWRIGHT_MCP_BASE_URL=http://playwright:3002
      - INNGEST_DEV=1
      - INNGEST_BASE_URL=http://inngest:8288
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY:-local-dev-key}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY:-local-signing-key}
    volumes:
      - ./src:/app/src
      - ./drizzle:/app/drizzle
    depends_on:
      db:
        condition: service_healthy
      playwright:
        condition: service_healthy
    command: >
      sh -c "npm run db:migrate && npm run dev"

  # Playwright MCP dependency
  playwright:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.playwright
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "const c=new AbortController(); const t=setTimeout(() => c.abort(), 2000); fetch('http://127.0.0.1:3002/sse', { signal: c.signal }).then((r) => { clearTimeout(t); process.exit(r.ok ? 0 : 1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inngest Dev Server (LOCAL DEVELOPMENT ONLY)
  # Production should use Inngest Cloud or a separately deployed self-hosted
  # Inngest server, not `inngest dev`.
  inngest:
    image: inngest/inngest:v1.17.2
    command: inngest dev -u http://server:3000/api/inngest
    ports:
      - "8288:8288"
      - "8289:8289"
    depends_on:
      - server

volumes:
  postgres_data:
