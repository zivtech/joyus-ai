name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joyus-ai-mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: joyus-ai-mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  validate-state:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joyus-ai-state
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: joyus-ai-state/package-lock.json

      - name: Install dependencies
        # --ignore-scripts skips the prepare hook (local git-hook installer),
        # so native modules must be rebuilt explicitly below.
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
